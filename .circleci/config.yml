version: 2.1

orbs:
  # orb info: https://circleci.com/developer/orbs/orb/rynkowsg/checkout
  # releases: https://github.com/rynkowsg/checkout-orb/releases
  checkout: rynkowsg/checkout@0.3.2
  # orb info: https://circleci.com/developer/orbs/orb/rynkowsg/mise
  # changelog: https://github.com/rynkowsg/mise-orb/blob/main/CHANGELOG.md
  mise: rynkowsg/mise@0.1.1

executors:
  docker_base_small_x86:
    # https://circleci.com/developer/images/image/cimg/base
    # https://hub.docker.com/r/cimg/base/tags
    docker: [{image: 'cimg/base:2026.10-26.04'}]
    resource_class: small

jobs:
  test:
    executor: docker_base_small_x86
    steps:
      - checkout/checkout: {depth: 1}
      - mise/setup:
          mise_version: v2026.10.11 # https://github.com/jdx/mise/releases
          # java is here because babashka and clojure need it.
          tools: >-
            babashka java
            clojure
      - run: bb test

workflows:
  main:
    jobs:
      - test
