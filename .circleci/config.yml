version: 2.1

orbs:
  checkout: rynkowsg/checkout@0.3.1
  mise: rynkowsg/mise@0.1.0

executors:
  docker_base_small_x86:
    # https://circleci.com/developer/images/image/cimg/base
    # https://hub.docker.com/r/cimg/base/tags
    docker: [{image: 'cimg/base:2026.09-24.04'}]
    resource_class: small

jobs:
  test:
    executor: docker_base_small_x86
    steps:
      - checkout/checkout: {depth: 1}
      - mise/setup:
          mise_version: v2026.10.11 # https://github.com/jdx/mise/releases
          # java is here because babashka and clojure need it.
          tools: >-
            babashka java
            clojure
      - run: bb test

workflows:
  main:
    jobs:
      - test
